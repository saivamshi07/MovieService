spring.application.name=movie-service
server.port=${SERVER_PORT:8082}

# ==============================================================================
# 1. PostgreSQL Database Configuration
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/movieServiceDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================================
# 2. Redis Configuration & Caching (LRU & TTL)
# ==============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT_MS:2000ms}

# Cache TTL Settings (in seconds)
# Home feed sections (Refreshed via scheduled jobs)
cache.ttl.home-trending-today=${CACHE_TTL_TRENDING_TODAY:3600}
cache.ttl.home-trending-week=${CACHE_TTL_TRENDING_WEEK:21600}
cache.ttl.home-popular=${CACHE_TTL_POPULAR:43200}
cache.ttl.home-top-rated=${CACHE_TTL_TOP_RATED:86400}
cache.ttl.home-now-playing=${CACHE_TTL_NOW_PLAYING:21600}
cache.ttl.genre-list=${CACHE_TTL_GENRE_LIST:604800}

# Entity Caching TTL (1 Day = 86400 seconds with LRU Eviction)
cache.ttl.movie-details=${CACHE_TTL_MOVIE_DETAILS:86400}
cache.ttl.actor-details=${CACHE_TTL_ACTOR_DETAILS:86400}
cache.ttl.crew-details=${CACHE_TTL_CREW_DETAILS:86400}

# Search Query Cache TTL (1 Day with LRU Eviction)
cache.ttl.search-query=${CACHE_TTL_SEARCH_QUERY:86400}

# ==============================================================================
# 2b. Proactive Pre-Warming Engine
# ==============================================================================
prewarm.enabled=${PREWARM_ENABLED:true}
prewarm.top-movies-limit=${PREWARM_TOP_MOVIES_LIMIT:10}
prewarm.throttle-delay-ms=${PREWARM_THROTTLE_DELAY_MS:250}

# ==============================================================================
# 3. TMDB (The Movie Database) API Configuration
# ==============================================================================
tmdb.api.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
tmdb.api.bearer-token=${TMDB_BEARER_TOKEN:eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIyM2FmZDExMWYxMjRlNTE0OWE5MzZiY2FkOGZmOTYyYSIsIm5iZiI6MTc2NDc5NDMxNi4wNiwic3ViIjoiNjkzMDlmY2NjMDQ4Y2UzNTRmNjMxZDkzIiwic2NvcGVzIjpbImFwaV9yZWFkIl0sInZlcnNpb24iOjF9.PIuhus3qmnqTipyB8CBj0f53ziNF2OvfC604U43kRow}
tmdb.api.api-key=${TMDB_API_KEY:}
tmdb.image.base-url=${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p}
tmdb.connect-timeout-ms=${TMDB_CONNECT_TIMEOUT_MS:10000}
tmdb.read-timeout-ms=${TMDB_READ_TIMEOUT_MS:15000}

# Industry / Cinema Preferences Defaults
# Supported Industries: HOLLYWOOD (en), BOLLYWOOD (hi), TOLLYWOOD (te), KOLLYWOOD (ta), MOLLYWOOD (ml), ALL
tmdb.default-industry=${TMDB_DEFAULT_INDUSTRY:ALL}
tmdb.default-language=${TMDB_DEFAULT_LANGUAGE:en-US}

# ==============================================================================
# 4. Security & JWT (Shared with user-service)
# ==============================================================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
gateway.secret=${GATEWAY_SHARED_SECRET:local-dev-gateway-secret}

# ==============================================================================
# 5. Apache Kafka Event Streaming (Rating Events)
# ==============================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Kafka Topics
kafka.topics.movie-rating=${KAFKA_TOPIC_MOVIE_RATING:movie.rating.v1}

# Transactional Outbox Scheduler
outbox.publisher.enabled=${OUTBOX_PUBLISHER_ENABLED:true}
outbox.publisher.fixed-delay-ms=${OUTBOX_PUBLISHER_DELAY_MS:2000}

# ==============================================================================
# 6. Recommendation Service Client Integration
# ==============================================================================
recommendation.service.base-url=${RECOMMENDATION_SERVICE_URL:http://localhost:8083}
recommendation.service.connect-timeout-ms=${RECOMMENDATION_CONNECT_TIMEOUT_MS:1500}
recommendation.service.read-timeout-ms=${RECOMMENDATION_READ_TIMEOUT_MS:2000}

# ==============================================================================
# 7. User Service Client & Graph Redis Integration
# ==============================================================================
user.service.base-url=${USER_SERVICE_URL:http://localhost:8081}
user.service.connect-timeout-ms=${USER_SERVICE_CONNECT_TIMEOUT_MS:1500}
user.service.read-timeout-ms=${USER_SERVICE_READ_TIMEOUT_MS:2000}

graph.redis.host=${GRAPH_REDIS_HOST:${spring.data.redis.host:localhost}}
graph.redis.port=${GRAPH_REDIS_PORT:${spring.data.redis.port:6379}}
graph.redis.password=${GRAPH_REDIS_PASSWORD:${spring.data.redis.password:}}
graph.redis.database=${GRAPH_REDIS_DATABASE:1}
graph.redis.timeout-ms=${GRAPH_REDIS_TIMEOUT_MS:2000}
